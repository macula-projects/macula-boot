server:
  port: ${SERVER_PORT:4000}

spring:
  profiles:
    active: @profile.active@
    group:
      docker: local
  application:
    name: macula-example-tencent-gateway
  config:
    import: optional:polaris
  cloud:
    polaris:
      config:
        enabled: true
        auto-refresh: true
        groups:
          - name: ${spring.application.name}
      discovery:
        enabled: true
        register: true

---
# local Profile 包含 IDE 本地开发所需的全部默认配置
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:36379}
      password: ${REDIS_PASSWORD:redis}
  cloud:
    nacos:
      discovery:
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:127.0.0.1:38849}
    polaris:
      address: ${POLARIS_SERVER_ADDR:grpc://127.0.0.1:38091}
      namespace: ${POLARIS_NAMESPACE:macula-dev}
    gateway:
      server:
        webflux:
          routes:
            - id: macula-example-tencent-consumer
              uri: lb://macula-example-tencent-consumer
              predicates:
                - Path=/consumer/**
              filters:
                - StripPrefix=1
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          client-id: e4da4a32-592b-46f0-ae1d-784310e88423
          client-secret: secret
          introspection-uri: ${OAUTH2_INTROSPECTION_URI:http://127.0.0.1:9010/oauth2/introspect}
  reactor:
    context-propagation: auto

macula:
  gateway:
    security:
      only-auth-urls: /api/**

logging:
  level:
    root: info
    dev.macula.example.gateway: debug
    dev.macula.boot.starter.cloud.gateway: debug
  file:
    name: ${user.home}/logs/${spring.application.name}/${spring.application.name}.log
  structured:
    format:
      console: logstash
      file: logstash

management:
  otlp:
    metrics:
      export:
        enabled: false
        url: http://127.0.0.1:34318/v1/metrics
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service:
        name: ${spring.application.name}
        namespace: macula-examples
      deployment:
        environment:
          name: local
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:34318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://127.0.0.1:34318/v1/logs

---
# Docker Profile 覆盖容器内 DNS 连接信息，其余沿用 local 默认配置
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    nacos:
      discovery:
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:polaris:8848}
    polaris:
      address: ${POLARIS_SERVER_ADDR:grpc://polaris:8091}
      namespace: ${POLARIS_NAMESPACE:macula-dev}

---
# 共享环境只保留配置中心连接信息，其余配置由 Polaris 配置组提供
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:127.0.0.1:38849}
    polaris:
      address: ${POLARIS_SERVER_ADDR:grpc://127.0.0.1:38091}
      namespace: ${POLARIS_NAMESPACE:macula-dev}

