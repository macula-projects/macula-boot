name: macula-boot-examples

services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.161.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ${PWD}/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      prometheus:
        condition: service_healthy
      loki-health:
        condition: service_healthy
      tempo-health:
        condition: service_healthy
    networks: [examples]

  otel-collector-health:
    image: ${CURL_IMAGE:-curlimages/curl:8.16.0}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://otel-collector:13133/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [examples]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3}
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ${PWD}/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [examples]

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.6.0}
    user: "0"
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ${PWD}/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks: [examples]

  loki-health:
    image: ${CURL_IMAGE:-curlimages/curl:8.16.0}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://loki:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [examples]

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:3.0.3}
    user: "0"
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ${PWD}/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    networks: [examples]

  tempo-health:
    image: ${CURL_IMAGE:-curlimages/curl:8.16.0}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://tempo:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [examples]

networks:
  examples:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
