server:
  port: 4020
  servlet:
    encoding:
      force: true

polaris:
  namespace: ${POLARIS_NAMESPACE:macula-dev}
  server-addr: ${POLARIS_SERVER_ADDR:grpc://127.0.0.1:8091}

spring:
  profiles:
    active: @profile.active@
  application:
    name: macula-example-tencent-provider
  config:
    import: optional:polaris
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:127.0.0.1:18849}
    polaris:
      address: ${polaris.server-addr}
      namespace: ${polaris.namespace}
      config:
        auto-refresh: true
        groups:
          - name: ${spring.application.name}
---
# 以下为 local Profile 本地默认配置；其他环境请在 Polaris 配置中心维护
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${GATEWAY_JWK_SET_URI:http://127.0.0.1:4000/oauth2/jwks}        # 网关地址

seata:
  enabled: false

feign:
  httpclient:
    enabled: false
    max-connections: 200 # 线程池最大连接数，默认200
    time-to-live: 900 # 线程存活时间，单位秒，默认900
    connection-timeout: 2000  # 新建连接超时时间，单位ms, 默认2000
    follow-redirects: true # 是否允许重定向，默认true
    disable-ssl-validation: false # 是否禁止SSL检查， 默认false
    okhttp:
      read-timeout: 60s # 请求超时时间，Duration配置方式
  okhttp:
    enabled: true
  sentinel:
    enabled: true

macula:
  security:
    ignore-urls:
      - /api/v1/provider1/echo
  oss: #文件存储配置
    default-platform: tencent-cos-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    tencent-cos: # 腾讯云 COS
      platform: tencent-cos-1 # 存储平台标识
      enable-storage: true  # 启用存储
      secret-id: test
      secret-key: test
      region: ap-guangzhou #存仓库所在地域
      bucket-name: jxh-cos-dev-1303039456
      domain: https://jxh-cos-dev-1303039456.cos.ap-guangzhou.myqcloud.com/ # 访问域名，注意“/”结尾
      base-path: jxh/ # 基础路径
springdoc:
  api-docs:
    enabled: true  # 默认是true，用于开关API文档
  swagger-ui:
    enabled: true # 默认是true，用于开关API UI

logging:
  level:
    root: info
    dev.macula.example: debug
  file:
    name: ${user.home}/logs/${spring.application.name}/${spring.application.name}.log
  structured:
    format:
      console: logstash
      file: logstash

management:
  endpoint:
    metrics:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_LOGS_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service:
        name: ${OTEL_SERVICE_NAME:${spring.application.name}}
        namespace: ${OTEL_SERVICE_NAMESPACE:macula-examples}
      deployment:
        environment:
          name: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://127.0.0.1:4318/v1/logs}
