server:
  port: ${SERVER_PORT:4020}

spring:
  profiles:
    active: @profile.active@
    group:
      docker: local
  application:
    name: macula-example-tencent-provider
  servlet:
    encoding:
      force: true
  config:
    import: optional:polaris
  cloud:
    polaris:
      config:
        enabled: true
        auto-refresh: true
        groups:
          - name: ${spring.application.name}
      discovery:
        enabled: true
        register: true
---
# local Profile 包含 IDE 本地开发所需的全部默认配置
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:36379}
      password: ${REDIS_PASSWORD:redis}
  cloud:
    nacos:
      discovery:
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:127.0.0.1:38849}
    polaris:
      address: ${POLARIS_SERVER_ADDR:grpc://127.0.0.1:38091}
      namespace: ${POLARIS_NAMESPACE:macula-dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:4000/oauth2/jwks        # 网关地址

seata:
  enabled: false

feign:
  httpclient:
    enabled: false
    max-connections: 200 # 线程池最大连接数，默认200
    time-to-live: 900 # 线程存活时间，单位秒，默认900
    connection-timeout: 2000  # 新建连接超时时间，单位ms, 默认2000
    follow-redirects: true # 是否允许重定向，默认true
    disable-ssl-validation: false # 是否禁止SSL检查， 默认false
    okhttp:
      read-timeout: 60s # 请求超时时间，Duration配置方式
  okhttp:
    enabled: true
  sentinel:
    enabled: true

macula:
  security:
    ignore-urls:
      - /api/v1/provider1/echo
  oss: #文件存储配置
    default-platform: tencent-cos-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    tencent-cos: # 腾讯云 COS
      platform: tencent-cos-1 # 存储平台标识
      enable-storage: true  # 启用存储
      secret-id: test
      secret-key: test
      region: ap-guangzhou #存仓库所在地域
      bucket-name: jxh-cos-dev-1303039456
      domain: https://jxh-cos-dev-1303039456.cos.ap-guangzhou.myqcloud.com/ # 访问域名，注意“/”结尾
      base-path: jxh/ # 基础路径
springdoc:
  api-docs:
    enabled: true  # 默认是true，用于开关API文档
  swagger-ui:
    enabled: true # 默认是true，用于开关API UI

logging:
  level:
    root: info
    dev.macula.example: debug
  file:
    name: ${user.home}/logs/${spring.application.name}/${spring.application.name}.log
  structured:
    format:
      console: logstash
      file: logstash

management:
  endpoint:
    metrics:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  otlp:
    metrics:
      export:
        enabled: false
        url: http://127.0.0.1:34318/v1/metrics
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service:
        name: ${spring.application.name}
        namespace: macula-examples
      deployment:
        environment:
          name: local
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:34318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://127.0.0.1:34318/v1/logs

---
# Docker Profile 覆盖容器内 DNS 连接信息，其余沿用 local 默认配置
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    nacos:
      discovery:
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:polaris:8848}
    polaris:
      address: ${POLARIS_SERVER_ADDR:grpc://polaris:8091}
      namespace: ${POLARIS_NAMESPACE:macula-dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://macula-example-tencent-gateway:4000/oauth2/jwks

---
# 共享环境只保留配置中心连接信息，其余配置由 Polaris 配置组提供
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:127.0.0.1:38849}
    polaris:
      address: ${POLARIS_SERVER_ADDR:grpc://127.0.0.1:38091}
      namespace: ${POLARIS_NAMESPACE:macula-dev}

