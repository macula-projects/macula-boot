server:
  port: 4010

spring:
  profiles:
    active: @profile.active@
  application:
    name: macula-example-tencent-consumer
  cloud:
    nacos:
      discovery:
        server-addr: ${POLARIS_NACOS_SERVER_ADDR:127.0.0.1:18849}
    polaris:
      address: ${polaris.server-addr}       # 全局 server-addr 参数
      namespace: ${polaris.namespace}       # 全局 namespace 参数
      config:
        auto-refresh: true                  # 选填，当配置发布后，动态刷新 Spring 上下文，默认值为 true
        groups:
          - name: ${spring.application.name}

# 和环境有关的配置信息，不同环境覆盖此处的配置
polaris:
  namespace: ${POLARIS_NAMESPACE:macula-dev}
  server-addr: ${POLARIS_SERVER_ADDR:grpc://127.0.0.1:8091}
