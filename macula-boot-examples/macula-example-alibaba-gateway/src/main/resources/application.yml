---
# observability Profile 由可观测部署叠加启用，应用配置直接指向 Collector
spring:
  config:
    activate:
      on-profile: observability
management:
  otlp:
    metrics:
      export:
        enabled: true
        url: http://otel-collector:4318/v1/metrics
        step: 10s
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: true
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    resource-attributes:
      deployment:
        environment:
          name: docker
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/logs
