#set( $symbol_dollar = '$' )
server:
  port: ${symbol_dollar}{SERVER_PORT:6003}

spring:
  profiles:
    active: @profile.active@
    group:
      docker: local
  application:
    name: ${rootArtifactId}-service1
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?refreshEnabled=true
  cache:
    # 缓存类型 redis、none(不使用缓存)
    type: redis
  cloud:
    nacos:
      server-addr: ${spring.config.nacos.server-addr}
      namespace: ${spring.config.nacos.namespace}
      username: ${spring.config.nacos.username}
      password: ${spring.config.nacos.password}
      discovery:
        namespace: ${spring.cloud.nacos.namespace}
        metadata:
          version: v1
  servlet:
    encoding:
      force: true

mybatis-plus:
  type-handlers-package: dev.macula.boot.starter.mp.handler
  #configuration:
  # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
  #  log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

macula:
  security:
    ignore-urls:
      - /api/v1/echo/**

---
# local Profile 包含 IDE 本地开发所需的全部默认配置
spring:
  config:
    activate:
      on-profile: local
    nacos:
      server-addr: 127.0.0.1:${symbol_dollar}{NACOS_SERVER_PORT:28848}
      namespace: ${symbol_dollar}{NACOS_NAMESPACE:MACULA5}
      username: ${symbol_dollar}{NACOS_USERNAME:nacos}
      password: ${symbol_dollar}{NACOS_PASSWORD:nacos}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:${symbol_dollar}{MYSQL_PORT:23306}/${rootArtifactId}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: ${symbol_dollar}{MYSQL_APP_USER:macula}
    password: ${symbol_dollar}{MYSQL_APP_PASSWORD:macula}
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: ${symbol_dollar}{REDIS_PORT:26379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:6000/oauth2/jwks
  cloud:
    sentinel:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

feign:
  httpclient:
    enabled: false
    max-connections: 200 # 线程池最大连接数，默认200
    time-to-live: 900 # 线程存活时间，单位秒，默认900
    connection-timeout: 2000  # 新建连接超时时间，单位ms, 默认2000
    follow-redirects: true # 是否允许重定向，默认true
    disable-ssl-validation: false # 是否禁止SSL检查， 默认false
    okhttp:
      read-timeout: 60s # 请求超时时间，Duration配置方式
  okhttp:
    enabled: true

seata:
  enabled: false

springdoc:
  api-docs:
    enabled: true  # 默认是true，用于开关API文档
  swagger-ui:
    enabled: true # 默认是true，用于开关API UI

logging:
  level:
    root: info
    dev.macula.samples: debug
  file:
    name: ${user.home}/logs/${spring.application.name}/${spring.application.name}.log
  structured:
    format:
      console: logstash
      file: logstash

management:
  otlp:
    metrics:
      export:
        enabled: false
        url: http://127.0.0.1:24318/v1/metrics
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service:
        name: ${spring.application.name}
        namespace: ${rootArtifactId}
      deployment:
        environment:
          name: local
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:24318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://127.0.0.1:24318/v1/logs

---
# Docker Profile 覆盖容器内 DNS 连接信息，其余沿用 local 默认配置
spring:
  config:
    activate:
      on-profile: docker
    nacos:
      server-addr: ${symbol_dollar}{NACOS_SERVER_ADDR:nacos:8848}
      namespace: ${symbol_dollar}{NACOS_NAMESPACE:MACULA5}
      username: ${symbol_dollar}{NACOS_USERNAME:nacos}
      password: ${symbol_dollar}{NACOS_PASSWORD:nacos}
  datasource:
    url: jdbc:mysql://mysql:3306/${rootArtifactId}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: ${symbol_dollar}{MYSQL_APP_USER}
    password: ${symbol_dollar}{MYSQL_APP_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://${rootArtifactId}-gateway:6000/oauth2/jwks

---
# 共享环境只保留配置中心连接信息，其余配置由 Nacos Data ID 提供
spring:
  config:
    activate:
      on-profile: dev
    nacos:
      server-addr: ${symbol_dollar}{NACOS_SERVER_ADDR:127.0.0.1:28848}
      namespace: ${symbol_dollar}{NACOS_NAMESPACE:MACULA5}
      username: ${symbol_dollar}{NACOS_USERNAME:nacos}
      password: ${symbol_dollar}{NACOS_PASSWORD:nacos}

