# 配置中心连接信息，必须保留在本地 application.yml 中
nacos:
  username: ${symbol_dollar}{NACOS_USERNAME:nacos}
  password: ${symbol_dollar}{NACOS_PASSWORD:nacos}
  config:
    server-addr: ${symbol_dollar}{NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${symbol_dollar}{NACOS_NAMESPACE:MACULA5}

server:
  port: 8080

spring:
  profiles:
    active: @profile.active@
  application:
    name: ${rootArtifactId}-gateway
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?refreshEnabled=true
  cloud:
    nacos:
      username: ${nacos.username}
      password: ${nacos.password}
      config:
        server-addr: ${nacos.config.server-addr}
        namespace: ${nacos.config.namespace}
        refresh-enabled: true
        file-extension: yml
      discovery:
        server-addr: ${nacos.config.server-addr}
        namespace: ${nacos.config.namespace}
        # group:
---
# 以下为 local Profile 本地默认配置；其他环境请在 Nacos 配置中心维护
spring:
  config:
    activate:
      on-profile: local
  cloud:
    sentinel:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: ${rootArtifactId}-admin-bff
              uri: lb://${rootArtifactId}-admin-bff
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1
            - id: ${rootArtifactId}-openapi
              uri: lb://${rootArtifactId}-openapi
              predicates:
                - Path=/openapi/**
              filters:
                - StripPrefix=1
  reactor:
    context-propagation: auto
  redis: # 网关自己的redis配置
    database: 0
    host: 127.0.0.1
    port: 6379
    system: # macula-cloud的system模块的redis配置
      database: 0
      host: 127.0.0.1
      port: 6379
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          client-id: e4da4a32-592b-46f0-ae1d-784310e88423
          client-secret: secret
          introspection-uri: http://127.0.0.1:9010/oauth2/introspect
macula:
  gateway:
    security:
      only-auth-urls: /api/**

logging:
  level:
    root: info
  file:
    name: ${user.home}/logs/${spring.application.name}/${spring.application.name}.log
  structured:
    format:
      console: logstash
      file: logstash

management:
  otlp:
    metrics:
      export:
        enabled: ${symbol_dollar}{OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${symbol_dollar}{OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
  tracing:
    sampling:
      probability: ${symbol_dollar}{OTEL_TRACES_SAMPLER_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${symbol_dollar}{OTEL_TRACES_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${symbol_dollar}{OTEL_LOGS_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service:
        name: ${symbol_dollar}{OTEL_SERVICE_NAME:${spring.application.name}}
        namespace: ${symbol_dollar}{OTEL_SERVICE_NAMESPACE:${rootArtifactId}}
      deployment:
        environment:
          name: ${symbol_dollar}{DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${symbol_dollar}{OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${symbol_dollar}{OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://127.0.0.1:4318/v1/logs}

---
spring:
  config:
    activate:
      on-profile: dev
nacos:
  username: maculav5
  #password: 请通过启动命令赋予密码
  config:
    server-addr: 10.94.108.55:8848
    namespace: MACULA5
