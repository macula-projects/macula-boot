#set( $symbol_dollar = '$' )
server:
  port: ${symbol_dollar}{SERVER_PORT:6000}

spring:
  profiles:
    active: @profile.active@
    group:
      docker: local
  application:
    name: ${rootArtifactId}-gateway
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${spring.config.nacos.server-addr}
      namespace: ${spring.config.nacos.namespace}
      username: ${spring.config.nacos.username}
      password: ${spring.config.nacos.password}
      discovery:
        namespace: ${spring.cloud.nacos.namespace}
    gateway:
      server:
        webflux:
          routes:
            - id: ${rootArtifactId}-admin-bff
              uri: lb://${rootArtifactId}-admin-bff
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1
            - id: ${rootArtifactId}-openapi
              uri: lb://${rootArtifactId}-openapi
              predicates:
                - Path=/openapi/**
              filters:
                - StripPrefix=1
macula:
  gateway:
    security:
      only-auth-urls: /api/**

---
# local Profile 包含 IDE 本地开发所需的全部默认配置
spring:
  config:
    activate:
      on-profile: local
    nacos:
      server-addr: 127.0.0.1:${symbol_dollar}{NACOS_SERVER_PORT:28848}
      namespace: ${symbol_dollar}{NACOS_NAMESPACE:MACULA5}
      username: ${symbol_dollar}{NACOS_USERNAME:nacos}
      password: ${symbol_dollar}{NACOS_PASSWORD:nacos}
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          client-id: e4da4a32-592b-46f0-ae1d-784310e88423
          client-secret: secret
          introspection-uri: ${symbol_dollar}{OAUTH2_INTROSPECTION_URI:http://127.0.0.1:9010/oauth2/introspect}
  redis: # 网关自己的redis配置
    database: 0
    host: ${symbol_dollar}{REDIS_HOST:127.0.0.1}
    port: ${symbol_dollar}{REDIS_PORT:26379}
    system: # macula-cloud的system模块的redis配置
      database: 0
      host: ${symbol_dollar}{MACULA_CLOUD_REDIS_HOST:127.0.0.1}
      port: ${symbol_dollar}{MACULA_CLOUD_REDIS_PORT:16379}
  cloud:
    sentinel:
      enabled: false
  reactor:
    context-propagation: auto

logging:
  level:
    root: info
  file:
    name: ${user.home}/logs/${spring.application.name}/${spring.application.name}.log
  structured:
    format:
      console: logstash
      file: logstash

management:
  otlp:
    metrics:
      export:
        enabled: false
        url: http://127.0.0.1:24318/v1/metrics
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service:
        name: ${spring.application.name}
        namespace: ${rootArtifactId}
      deployment:
        environment:
          name: local
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:24318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://127.0.0.1:24318/v1/logs

---
# Docker Profile 覆盖容器内 DNS 连接信息，其余沿用 local 默认配置
spring:
  config:
    activate:
      on-profile: docker
    nacos:
      server-addr: ${symbol_dollar}{NACOS_SERVER_ADDR:nacos:8848}
      namespace: ${symbol_dollar}{NACOS_NAMESPACE:MACULA5}
      username: ${symbol_dollar}{NACOS_USERNAME:nacos}
      password: ${symbol_dollar}{NACOS_PASSWORD:nacos}
  redis:
    host: ${symbol_dollar}{REDIS_HOST:redis}
    port: 6379
    system:
      host: ${symbol_dollar}{MACULA_CLOUD_REDIS_HOST:host.docker.internal}
      port: ${symbol_dollar}{MACULA_CLOUD_REDIS_PORT:16379}

---
# 共享环境只保留配置中心连接信息，其余配置由 Nacos Data ID 提供
spring:
